<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SchoolHub · 장평중학교</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="tds/colors_and_type.css">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #F2F4F6;
    height: 100vh; overflow: hidden;
    font-family: var(--tds-font-sans);
  }
  .stage { position: fixed; inset: 0; }
  .device-fit { transform-origin: center center; }
  .sh-mobile-scroll {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .sh-mobile-scroll::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;
  }
</style>
</head>
<body>
<div id="root" class="stage"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Optional: NEIS sync config (KEY는 서버 환경변수 NEIS_API_KEY 사용 권장) -->
<script>
  const SH_IS_LOCAL = window.location.protocol === "file:" || ["127.0.0.1", "localhost"].includes(window.location.hostname);
  window.SH_NEIS_CONFIG = {
    enabled: true,
    key: "",
    proxyUrl: window.location.protocol === "http:" || window.location.protocol === "https:" ? (SH_IS_LOCAL ? "" : "/api/neis") : "",
    officeCode: "",
    schoolCode: "",
    schoolName: "장평중학교",
    schoolLevel: "middle",
    grade: 3,
    className: 5,
  };
  window.SH_BACKEND_CONFIG = {
    enabled: !SH_IS_LOCAL && (window.location.protocol === "http:" || window.location.protocol === "https:"),
    endpoint: "/api/state",
  };
</script>

<!-- TDS base -->
<script type="text/babel" src="tds/ios-frame.jsx"></script>
<script type="text/babel" src="tds/Icons.jsx"></script>
<script type="text/babel" src="tds/Primitives.jsx"></script>
<script type="text/babel" src="tds/tweaks-panel.jsx"></script>

<!-- SchoolHub data + components -->
<script type="text/babel" src="src/i18n.jsx"></script>
<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/state/core.jsx"></script>
<script type="text/babel" src="src/schoolTime.jsx"></script>
<script type="text/babel" src="src/neis.jsx"></script>
<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/shPrimitives.jsx"></script>

<!-- Screens -->
<script type="text/babel" src="src/screens/Home.jsx"></script>
<script type="text/babel" src="src/screens/Meal.jsx"></script>
<script type="text/babel" src="src/screens/Timetable.jsx"></script>
<script type="text/babel" src="src/screens/Calendar.jsx"></script>
<script type="text/babel" src="src/screens/LostFound.jsx"></script>
<script type="text/babel" src="src/screens/Anonymous.jsx"></script>
<script type="text/babel" src="src/screens/Board.jsx"></script>
<script type="text/babel" src="src/screens/Forms.jsx"></script>
<script type="text/babel" src="src/screens/Exams.jsx"></script>
<script type="text/babel" src="src/screens/More.jsx"></script>
<script type="text/babel" src="src/screens/Admin.jsx"></script>

<!-- Desktop screens -->
<script type="text/babel" src="pc/PCPrimitives.jsx"></script>
<script type="text/babel" src="pc/Home.jsx"></script>
<script type="text/babel" src="pc/Anonymous.jsx"></script>
<script type="text/babel" src="pc/Lost.jsx"></script>
<script type="text/babel" src="pc/Board.jsx"></script>
<script type="text/babel" src="pc/Admin.jsx"></script>
<script type="text/babel" src="pc/Screens.jsx"></script>

<!-- App shells -->
<script type="text/babel" src="src/App.jsx"></script>
<script type="text/babel" src="pc/PCApp.jsx"></script>

<!-- Unified Root -->
<script type="text/babel" src="src/UnifiedApp.jsx"></script>
</body>
</html>
